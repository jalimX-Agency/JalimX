  <!--
    The tab icon. Literal colours, because a favicon has no page around it
    for currentColor or a CSS variable to resolve against. The ink half
    turns white on a dark browser theme, where near-black on a dark tab
    strip would leave only the blue half visible.
  -->
  <style>
    .ink { fill: #1A1A1A; }
    @media (prefers-color-scheme: dark) { .ink { fill: #FFFFFF; } }
  </style>
